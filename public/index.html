<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Grid</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
    <!-- Lobby View -->
    <!-- Lobby View -->
    <div id="lobby-screen" class="screen">
        <div class="lobby-overlay"></div>
        <div class="lobby-content">
            <h1 class="lobby-title">Live The Action On Squad Grid</h1>
            <p class="lobby-subtitle">Experience the ultimate African sports trivia. Claim your squad's spot in the arena now.</p>
            
            <div id="action-bar">
                <!-- Initial Start Button matching the UI reference -->
                <button id="start-entry-btn" class="pill-btn primary-pill">
                    <span>Start</span>
                    <span class="chevron">>>></span>
                </button>
                
                <!-- Hidden by default until Start is clicked -->
                <div id="team-selection" class="team-buttons hidden">
                    <button class="join-btn pill-btn" data-team="Team A">Join Team A</button>
                    <button class="join-btn pill-btn" data-team="Team B">Join Team B</button>
                    <button class="join-btn pill-btn" data-team="Team C">Join Team C</button>
                </div>
            </div>
            
            <div id="status-message" class="hidden" style="margin-top: 15px; font-weight: bold;"></div>
            
            <div class="admin-panel" style="margin-top: 25px; position: relative; z-index: 10;">
                <button id="start-game-btn" class="admin-btn">Start Game (Admin)</button>
            </div>
        </div>
    </div>

    <!-- Active Question Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="hud">
            <div id="hud-team" class="hud-item">Squad: --</div>
            <div id="hud-timer" class="hud-item timer">10s</div>
        </div>

        <div class="timer-progress-track">
            <div id="timer-progress-fill" class="timer-progress-fill"></div>
        </div>

        <div id="question-box">
            <h2 id="question-text">Loading question...</h2>
        </div>

        <div id="image-grid" class="image-grid">
            <!-- Dynamic 4 images -->
        </div>

        <div id="lockout-banner" class="lockout-banner hidden">
            Answer Locked by Teammate!
        </div>
    </div>

    <!-- NEW: Full-Screen Live Standings -->
    <div id="leaderboard-screen" class="screen hidden">
        <h1 class="title" style="color: #ffaa00;">LIVE STANDINGS</h1>
        <p class="subtitle">Who is taking the crown?</p>
        
        <div id="rankings-container" class="rankings-box">
            <!-- Dynamically populated via JS -->
        </div>

        <div class="admin-panel">
            <button id="next-q-btn" class="admin-btn">Next Question (Admin)</button>
        </div>
    </div>

    <!-- Feedback Pop-up Overlay -->
    <div id="feedback-modal" class="modal-backdrop hidden">
        <div id="feedback-card" class="modal-card">
            <div id="feedback-badge" class="badge">CORRECT!</div>
            <h3 id="feedback-comment">Comment here</h3>
            <p id="feedback-subtext">Next play incoming...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
