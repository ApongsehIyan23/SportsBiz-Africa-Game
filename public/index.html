<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Grid</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
    <!-- Lobby View -->
    <div id="lobby-screen" class="screen">
        <h1 class="title">SQUAD GRID</h1>
        <p class="subtitle">Select your team to enter the arena</p>
        
        <div class="team-buttons">
            <button class="join-btn" data-team="Team A">Join Team A</button>
            <button class="join-btn" data-team="Team B">Join Team B</button>
            <button class="join-btn" data-team="Team C">Join Team C</button>
        </div>
        
        <div id="status-message">Waiting for players...</div>
        
        <div class="admin-panel">
            <button id="start-game-btn" class="admin-btn">Start Game (Admin)</button>
        </div>
    </div>

    <!-- Active Question Screen -->
    <div id="game-screen" class="screen hidden">
        <!-- Persistent Score & HUD Bar -->
        <div class="scoreboard-bar">
            <div class="score-pill"><span class="team-name">Team A:</span> <span id="score-a">0</span></div>
            <div class="score-pill"><span class="team-name">Team B:</span> <span id="score-b">0</span></div>
            <div class="score-pill"><span class="team-name">Team C:</span> <span id="score-c">0</span></div>
        </div>

        <div class="hud">
            <div id="hud-team" class="hud-item">Squad: --</div>
            <div id="hud-timer" class="hud-item timer">10s</div>
        </div>

        <div class="timer-progress-track">
            <div id="timer-progress-fill" class="timer-progress-fill"></div>
        </div>

        <div id="question-box">
            <h2 id="question-text">Loading question...</h2>
        </div>

        <div id="image-grid" class="image-grid">
            <!-- Dynamic 4 images -->
        </div>

        <div id="lockout-banner" class="lockout-banner hidden">
            Answer Locked by Teammate!
        </div>

        <!-- Dev Control to manually advance questions -->
        <div class="admin-panel">
            <button id="next-q-btn" class="admin-btn">Next Question (Admin)</button>
        </div>
    </div>

    <!-- Feedback Pop-up Overlay -->
    <div id="feedback-modal" class="modal-backdrop hidden">
        <div id="feedback-card" class="modal-card">
            <div id="feedback-badge" class="badge">CORRECT!</div>
            <h3 id="feedback-comment">Comment here</h3>
            <p id="feedback-subtext">Next play incoming...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
