<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Grid</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
</head>
<body>
    <!-- Lobby View -->
    <div id="lobby-screen" class="screen">
        <h1 class="title">SQUAD GRID</h1>
        <p class="subtitle">Select your team to enter the arena</p>
        
        <div class="team-buttons">
            <button class="join-btn" data-team="Team A">Join Team A</button>
            <button class="join-btn" data-team="Team B">Join Team B</button>
            <button class="join-btn" data-team="Team C">Join Team C</button>
        </div>
        
        <div id="status-message">Waiting for players...</div>
        
        <!-- Dev/Admin Launch Controls -->
        <div class="admin-panel">
            <button id="start-game-btn" class="admin-btn">Start Game (Admin)</button>
        </div>
    </div>

    <!-- Active Question Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="hud">
            <div id="hud-team" class="hud-item">Squad: --</div>
            <div id="hud-status" class="hud-item">Choose fast!</div>
        </div>

        <div id="question-box">
            <h2 id="question-text">Loading question...</h2>
        </div>

        <div id="image-grid" class="image-grid">
            <!-- 4 player photos injected dynamically -->
        </div>

        <div id="lockout-banner" class="lockout-banner hidden">
            Answer Locked by Teammate!
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
